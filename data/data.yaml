# YOLO dataset config for PPE safety detection.
# Populate data/images/{train,val} and data/labels/{train,val} via `dvc pull`.

path: data          # dataset root (relative to project root)
train: images/train
val: images/val

# Class names — order defines the class index used in label files.
names:
  0: Hardhat
  1: Mask
  2: NO-Hardhat
  3: NO-Mask
  4: NO-Safety Vest
  5: Person
  6: Safety Cone
  7: Safety Vest
  8: machinery
  9: vehicle
