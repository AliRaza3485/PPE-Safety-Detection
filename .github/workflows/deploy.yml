# .github/workflows/deploy.yml
name: Deploy PPE API

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Stage 1: run the test suite. build + deploy are gated on this passing. ──
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (CPU torch — same as the image — plus test tools)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest httpx
          # httpx is required by FastAPI's TestClient. PYTHONPATH (in the next
          # step) makes the top-level `api` package and the src-layout
          # `ppe_detector` importable without a heavy `pip install .`.

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: python -m pytest -q

  # ── Stage 2: build the image and push to Docker Hub (only if tests pass). ──
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # OPTION 1 (DEFAULT): models/best.pt is committed to git (~6 MB),
      # NOT in .gitignore. actions/checkout above already fetches it —
      # no extra step needed.
      # ------------------------------------------------------------------

      # ------------------------------------------------------------------
      # OPTION 2 (ALTERNATIVE): keep best.pt DVC-tracked instead of
      # committing it. Uncomment the steps below AND remove/skip Option 1.
      # Required secrets depend on your DVC remote type:
      #   - S3 remote:      AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
      #   - DagsHub remote: DAGSHUB_USERNAME, DAGSHUB_TOKEN
      #
      # - name: Set up Python (for DVC)
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.11"
      #
      # - name: Install DVC
      #   run: pip install "dvc[s3]"   # change extras to match your remote, e.g. dvc[dagshub]
      #
      # - name: Configure DVC remote credentials
      #   run: |
      #     dvc remote modify origin --local access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     dvc remote modify origin --local secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #
      # - name: Pull model weights from DVC remote
      #   run: dvc pull models/best.pt.dvc
      # ------------------------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ppe-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ppe-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ${{ secrets.AWS_EC2_USER}}
          key: ${{ secrets.AWS_EC2_SSH_KEY }}
          script: |
            set -e
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/ppe-api:latest"

            # If your Docker Hub repo is PRIVATE, uncomment this login step
            # (DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets are already available here):
            # echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            docker pull "$IMAGE"

            docker stop ppe-api || true
            docker rm ppe-api || true

            docker run -d \
              --name ppe-api \
              --restart unless-stopped \
              -p 80:8000 \
              -e PPE_DEVICE=cpu \
              "$IMAGE"

            docker image prune -f